{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>In A Digi Way</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="icon" type="image/x-icon" href="{% static 'images/fav.ico' %}">
  <style>
    .logo-wrapper {
      padding: 0 20px;
      text-align: center;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    .logo-wrapper img {
      max-width: 100%;
      height: auto;
      transition: 0.3s ease-in-out;
    }

    .logo-wrapper img:hover {
      opacity: 0.85;
    }

    body {
      margin: 0;
      background: #f0f0f0;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <div class="logo-wrapper">
    <a href="https://www.instagram.com/inadigiway" target="_blank" rel="noopener noreferrer">
      <img src="{% static 'images/DigiWay.jpg' %}" alt="In A Digi Way">
    </a>
  </div>

</body>
</html>
