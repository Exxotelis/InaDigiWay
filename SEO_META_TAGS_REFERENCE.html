<!-- Language Selector for Header -->
<div class="language-selector" style="position: fixed; top: 20px; right: 20px; z-index: 1000;">
  <select onchange="changeLanguage(this.value)" style="padding: 8px 12px; border-radius: 4px; border: 2px solid #FA01A2; background-color: #fff; color: #333; font-weight: 600; cursor: pointer;">
    <option value="/en/" selected>🇬🇧 English</option>
    <option value="/el/">🇬🇷 Ελληνικά</option>
  </select>
</div>

<script>
function changeLanguage(lang_url) {
  window.location.href = lang_url + window.location.pathname.split('/').slice(2).join('/');
}
</script>
